services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bito_server
    restart: always
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      SERVER_ENV: "development"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "postgres"
      DB_PASSWORD: "1221"
      DB_NAME: "bito_db"
      DB_SSLMODE: "disable"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      SMTP_HOST: "mailpit"
      SMTP_PORT: "1025"
      SMTP_FROM: "no-reply@bito.local"
      JWT_SECRET: "super-secret-jwt-key-change-in-production"
      JWT_ACCESS_EXPIRY: "15m"
      JWT_REFRESH_EXPIRY: "168h"
    depends_on:
      - postgres
      - redis
      - mailpit

  postgres:
    image: postgres:16-alpine
    container_name: bito_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1221"
      POSTGRES_DB: bito_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bito_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: bito_mailpit
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  redis_data:
