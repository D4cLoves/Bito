version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bito_postgres
    restart: always
    environment:
      POSTGRES_USER: bito_user
      POSTGRES_PASSWORD: bito_password
      POSTGRES_DB: bito_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bito_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Mailpit: Локальный SMTP сервер с красивым веб-интерфейсом для тестирования кодов подтверждения email
  mailpit:
    image: axllent/mailpit:latest
    container_name: bito_mailpit
    restart: always
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI (открыть в браузере http://localhost:8025)

volumes:
  postgres_data:
  redis_data:
